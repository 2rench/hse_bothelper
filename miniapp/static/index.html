<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5f6f7"
    >

    <title>HSE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>

<div class="app-shell">

    <header class="topbar">
        <div class="topbar-info">
            <div class="brand">HSE</div>
            <div
                class="topbar-subtitle"
                id="topbarSubtitle"
            >
                Расписание
            </div>
        </div>

        <button
            class="avatar"
            id="avatarButton"
            type="button"
        >
            H
        </button>
    </header>


    <main class="content">

        <section
            class="screen active"
            id="screenSchedule"
        >
            <div class="screen-heading">

                <div>
                    <h1 id="scheduleTitle">
                        Сегодня
                    </h1>

                    <div
                        class="greeting-bar"
                        id="greetingBar"
                        hidden
                    ></div>
                </div>

                <button
                    class="icon-button"
                    id="refreshButton"
                    type="button"
                    aria-label="Обновить"
                >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-3-6.7"/>
                        <polyline points="21 3 21 9 15 9"/>
                    </svg>
                </button>

            </div>

            <div
                id="weekPicker"
                class="week-picker"
                hidden
            >
                <div class="week-picker-title">
                    Неделя
                </div>

                <div
                    id="weekPickerList"
                    class="week-picker-list"
                ></div>
            </div>

            <div
                id="scheduleContainer"
                class="schedule-container"
            ></div>
        </section>


        <section
            class="screen"
            id="screenSessions"
        >

            <div class="screen-heading">
                <div>
                    <h1>
                        Сессия
                    </h1>
                </div>
            </div>

            <div
                id="sessionsContainer"
                class="sessions-list"
            ></div>

            <div
                id="sessionLessonsContainer"
                class="schedule-container"
            ></div>

        </section>


        <section
            class="screen"
            id="screenProfile"
        >

            <div class="profile-hero">

                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    H
                </div>

                <div class="profile-hero-text">

                    <h1 id="profileName">
                        HSE
                    </h1>

                    <div
                        class="profile-group"
                        id="profileGroup"
                    >
                        —
                    </div>

                </div>

            </div>


            <div class="section-title">
                Настройки
            </div>


            <div class="settings-card">

                <button
                    class="settings-row"
                    data-action="excluded"
                    type="button"
                >
                    <span class="settings-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                        </svg>
                    </span>

                    <span class="settings-copy">
                        <strong>
                            Исключить пары
                        </strong>

                        <small>
                            Управление скрытыми предметами
                        </small>
                    </span>

                    <span class="settings-arrow">
                        →
                    </span>
                </button>


                <button
                    class="settings-row"
                    data-action="calendar"
                    type="button"
                >
                    <span class="settings-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                    </span>

                    <span class="settings-copy">
                        <strong>
                            Календарь
                        </strong>

                        <small>
                            Подписка на расписание
                        </small>
                    </span>

                    <span class="settings-arrow">
                        →
                    </span>
                </button>

            </div>


            <div class="section-title">
                Уведомления
            </div>


            <div class="settings-card">

                <button
                    class="settings-row"
                    id="scheduleUpdatesButton"
                    data-action="toggle-notification"
                    data-field="schedule_updates"
                    type="button"
                >
                    <span class="settings-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </span>

                    <span class="settings-copy">
                        <strong>
                            Изменения расписания
                        </strong>

                        <small>
                            Уведомления о новых изменениях
                        </small>
                    </span>

                    <span
                        class="toggle-value"
                        id="scheduleUpdatesValue"
                    >
                        —
                    </span>
                </button>


                <button
                    class="settings-row"
                    id="tomorrowButton"
                    data-action="toggle-notification"
                    data-field="tomorrow_notifications"
                    type="button"
                >
                    <span class="settings-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>
                        </svg>
                    </span>

                    <span class="settings-copy">
                        <strong>
                            Завтрашнее расписание
                        </strong>

                        <small>
                            Напоминание о парах
                        </small>
                    </span>

                    <span
                        class="toggle-value"
                        id="tomorrowValue"
                    >
                        —
                    </span>
                </button>

            </div>


            <div class="section-title">
                Оформление
            </div>


            <div class="settings-card appearance-card">

                <div class="appearance-title">
                    Интерфейс
                </div>

                <div
                    class="segmented"
                    id="appearanceControl"
                >

                    <button
                        type="button"
                        data-appearance="light"
                    >
                        Светлая
                    </button>

                    <button
                        type="button"
                        data-appearance="dark"
                    >
                        Тёмная
                    </button>

                </div>

            </div>


            <div class="section-title">
                Тема
            </div>


            <div
                class="themes-grid"
                id="themesGrid"
            ></div>

        </section>


        <section
            class="screen"
            id="screenExcluded"
        >

            <div class="screen-heading">

                <div>
                    <h1>
                        Исключить пары
                    </h1>
                </div>

            </div>

            <p class="screen-description">
                Нажми на предмет, чтобы скрыть его
                из сегодняшнего, завтрашнего и
                недельного расписания
            </p>

            <div
                class="excluded-grid"
                id="excludedGrid"
            ></div>

        </section>

    </main>


    <nav class="bottom-nav">

        <button
            class="nav-item active"
            data-view="today"
            type="button"
        >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="3"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <circle cx="12" cy="16" r="1.6" fill="currentColor" stroke="none"/>
            </svg>
            <small>Сегодня</small>
        </button>

        <button
            class="nav-item"
            data-view="tomorrow"
            type="button"
        >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="3"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <path d="M9 16l3 3 4-4"/>
            </svg>
            <small>Завтра</small>
        </button>

        <button
            class="nav-item"
            data-view="week"
            type="button"
        >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="3"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <line x1="9" y1="14" x2="9" y2="18"/>
                <line x1="13" y1="14" x2="13" y2="18"/>
                <line x1="17" y1="14" x2="17" y2="18"/>
            </svg>
            <small>Неделя</small>
        </button>

        <button
            class="nav-item"
            data-view="sessions"
            type="button"
        >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5V6a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/>
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"/>
                <line x1="9" y1="8" x2="15" y2="8"/>
            </svg>
            <small>Сессия</small>
        </button>

        <button
            class="nav-item"
            data-view="profile"
            type="button"
        >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="3.6"/>
                <path d="M4.5 20c1-4 4-6 7.5-6s6.5 2 7.5 6"/>
            </svg>
            <small>Профиль</small>
        </button>

    </nav>

</div>


<div
    class="toast"
    id="toast"
></div>


<script src="/static/app.js"></script>

</body>
</html>
